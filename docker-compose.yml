services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: finance
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  api:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      - db
  web:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - api
volumes:
  postgres_data:
